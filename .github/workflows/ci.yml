name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: services/control-core

jobs:
  # ---------------------------------------------------------------------------
  # Protocol + Platform contract tests — pure Python, fast, cross-platform
  # ---------------------------------------------------------------------------
  protocol-platform:
    name: Protocol & Platform (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.14"]
        exclude:
          # 3.14 is the dev machine version; test it on Linux only to catch
          # bleeding-edge issues without slowing Windows/macOS jobs.
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/control-core/pyproject.toml

      - name: Install control-core (deps only — no optional platform packages)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: services/control-core

      - name: Protocol v1 schema tests
        run: python -m pytest packages/protocol/tests/ -v --tb=short
        working-directory: services/control-core

      - name: Platform contract tests
        run: python -m pytest packages/platform/tests/ -v --tb=short
        working-directory: services/control-core

      - name: Cross-platform IPC smoke test
        run: |
          python -m pytest ../../tests/ipc_smoke/ -v --tb=short
        working-directory: services/control-core

  # ---------------------------------------------------------------------------
  # Full control-core unit tests — the existing myself-agent suite
  # ---------------------------------------------------------------------------
  control-core-unit:
    name: Control Core unit tests (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/control-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,windows]"
        working-directory: services/control-core

      - name: Ruff lint
        run: ruff check . --statistics
        working-directory: services/control-core
        continue-on-error: true  # P0: don't block on existing lint debt

      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short -q
        working-directory: services/control-core
        env:
          TESTING: "1"

      - name: Windows platform tests (windows-latest only)
        if: matrix.os == 'windows-latest'
        run: python -m pytest packages/platform/windows/tests/ -v --tb=short -q
        working-directory: services/control-core
        env:
          TESTING: "1"

      - name: P3 gate tests (no-bypass + unknown-outcome)
        run: python -m pytest tests/unit/test_no_bypass.py tests/unit/test_unknown_outcome.py -v --tb=short
        working-directory: services/control-core
        env:
          TESTING: "1"

      - name: Check alembic migration head
        run: alembic check
        working-directory: services/control-core
        env:
          TESTING: "1"

  # ---------------------------------------------------------------------------
  # macOS smoke — import + protocol only (no full suite yet, P5/P6)
  # ---------------------------------------------------------------------------
  macos-smoke:
    name: macOS smoke (import + protocol)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-core/pyproject.toml

      - name: Install control-core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: services/control-core

      - name: Protocol + platform tests (macOS smoke)
        run: |
          python -m pytest packages/protocol/tests/ packages/platform/tests/ ../../tests/ipc_smoke/ -v --tb=short
        working-directory: services/control-core

  # ---------------------------------------------------------------------------
  # Frontend lint (operator-console) — non-blocking for now
  # ---------------------------------------------------------------------------
  frontend-smoke:
    name: Operator Console smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-console-src/package-lock.json

      - name: Check package.json parseable
        run: |
          node -e "const p = require('./package.json'); console.log(p.name, p.version)"
        working-directory: apps/web-console-src

  # ---------------------------------------------------------------------------
  # License policy gate (P4 blocker #9 / GA-1.4) — fail-closed on every axis:
  # missing tool, unparsable output, zero components, empty/unknown/AGPL/SSPL.
  # Runs on windows so the locked requirements-win-locked.txt set installs
  # exactly like the release host (the Python scan targets the real env).
  # ---------------------------------------------------------------------------
  license-policy:
    name: License policy (rust+python+npm)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install cargo-deny (record exact version)
        run: |
          cargo install --locked cargo-deny
          cargo deny --version
      - name: Rust license check (deny.toml)
        run: |
          cd apps/desktop/src-tauri
          cargo deny --config ${{ github.workspace }}/tools/license-policy/deny.toml check licenses
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-licenses + locked runtime deps (the real scan set)
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses==5.5.5
          pip install -r services/control-core/requirements-win-locked.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install desktop deps (manifest scan needs node_modules)
        run: npm ci
        working-directory: apps/desktop
      - name: Python + Node license check (fail-closed)
        run: python tools/license-policy/check_licenses.py

  # ---------------------------------------------------------------------------
  # Reproducible Windows release build (P4 blocker #8 / GA-1.6) — cloud runner
  # builds the UNSIGNED sidecar + desktop EXE + NSIS from the same commit +
  # lockfiles, and publishes digests/sizes/tool versions/Nuitka report/logs
  # for comparison against the local build (docs/releases/v1.0-gate.md).
  # Toolchain pinned to the release host: rust 1.97.1, node 24.18.0,
  # python 3.12, Nuitka via scripts/nuitka-build/requirements-build.lock.
  # ---------------------------------------------------------------------------
  windows-release-build:
    name: Windows release build (reproducibility)
    runs-on: windows-latest
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/release/windows-v1.0.0-rc' ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record tool versions
        shell: pwsh
        run: |
          @(
            "commit=$env:GITHUB_SHA",
            "node=$(node --version)",
            "npm=$(npm --version)",
            "cargo=$(cargo --version)",
            "rustc=$(rustc --version)",
            "python=$(python --version)",
            "nuitka=$(Select-String -Path services/control-core/scripts/nuitka-build/requirements-build.lock -Pattern 'Nuitka==(\S+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })"
          ) | Tee-Object -FilePath tool-versions.txt

      # GA-1.6: sidecar MUST be built before npm ci / tauri build so the
      # resources below exist; a clean checkout has none of them.
      - name: Build sidecar (Nuitka, locked deps)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\services\control-core\scripts\nuitka-build\build.ps1 -Jobs 4 2>&1 |
            Tee-Object -FilePath nuitka-build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "sidecar build failed" }

      - name: Verify sidecar resources exist (fail if missing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "apps/desktop/src-tauri/resources/sidecar/sidecar.exe",
            "apps/desktop/src-tauri/resources/sidecar/bootstrap/agent_platform.db",
            "apps/desktop/src-tauri/resources/sidecar/bootstrap/manifest.json"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f -PathType Leaf)) { throw "MISSING release artifact: $f" }
            "OK $f"
          }

      - name: Build unsigned desktop EXE
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri -- build --no-bundle --no-sign 2>&1 | Tee-Object -FilePath ../../tauri-build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "unsigned desktop build failed" }

      - name: Build unsigned NSIS bundle
        working-directory: apps/desktop
        run: |
          npm run tauri -- bundle --bundles nsis --no-sign 2>&1 | Tee-Object -FilePath ../../tauri-bundle-log.txt
          if ($LASTEXITCODE -ne 0) { throw "unsigned NSIS bundle failed" }

      - name: Collect digests (sidecar + desktop + NSIS; fail if any missing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*1.0.0*x64-setup.exe" -File |
            Select-Object -First 1
          $files = @(
            "apps/desktop/src-tauri/resources/sidecar/sidecar.exe",
            "apps/desktop/src-tauri/target/release/tauri-spike.exe"
          )
          if ($nsis) { $files += $nsis.FullName } else { throw "MISSING NSIS installer" }
          $out = @()
          foreach ($f in $files) {
            if (-not (Test-Path $f -PathType Leaf)) { throw "MISSING release artifact: $f" }
            $h = (Get-FileHash $f -Algorithm SHA256).Hash
            $size = (Get-Item $f).Length
            $out += "SHA256 $h  $size  $(Split-Path $f -Leaf)"
          }
          $out | Tee-Object -FilePath release-digests.txt
          "commit=$env:GITHUB_SHA" | Add-Content release-digests.txt
          "built_at=$(Get-Date -Format o)" | Add-Content release-digests.txt

      - name: Collect Nuitka report
        shell: pwsh
        run: |
          $report = Get-ChildItem "services/control-core/scripts/nuitka-build/dist-final/reports/nuitka-compilation-*.xml" -File |
            Sort-Object LastWriteTime | Select-Object -Last 1
          if ($report) { Copy-Item $report.FullName nuitka-report.xml }
          else { throw "MISSING Nuitka compilation report" }

      - name: Upload digests + report + logs
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.sha }}
          path: |
            release-digests.txt
            tool-versions.txt
            nuitka-report.xml
            nuitka-build-log.txt
            tauri-build-log.txt
            tauri-bundle-log.txt
          retention-days: 90
          if-no-files-found: error
