name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: services/control-core

jobs:
  # ---------------------------------------------------------------------------
  # Protocol + Platform contract tests — pure Python, fast, cross-platform
  # ---------------------------------------------------------------------------
  protocol-platform:
    name: Protocol & Platform (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.14"]
        exclude:
          # 3.14 is the dev machine version; test it on Linux only to catch
          # bleeding-edge issues without slowing Windows/macOS jobs.
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/control-core/pyproject.toml

      - name: Install control-core (deps only — no optional platform packages)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: services/control-core

      - name: Protocol v1 schema tests
        run: python -m pytest packages/protocol/tests/ -v --tb=short
        working-directory: services/control-core

      - name: Platform contract tests
        run: python -m pytest packages/platform/tests/ -v --tb=short
        working-directory: services/control-core

      - name: Cross-platform IPC smoke test
        run: |
          python -m pytest ../../tests/ipc_smoke/ -v --tb=short
        working-directory: services/control-core

  # ---------------------------------------------------------------------------
  # Full control-core unit tests — the existing myself-agent suite
  # ---------------------------------------------------------------------------
  control-core-unit:
    name: Control Core unit tests (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/control-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,windows]"
        working-directory: services/control-core

      - name: Ruff lint
        run: ruff check . --statistics
        working-directory: services/control-core
        continue-on-error: true  # P0: don't block on existing lint debt

      - name: Run unit tests
        run: python -m pytest tests/unit -v --tb=short -q
        working-directory: services/control-core
        env:
          TESTING: "1"

      - name: Windows platform tests (windows-latest only)
        if: matrix.os == 'windows-latest'
        run: python -m pytest packages/platform/windows/tests/ -v --tb=short -q
        working-directory: services/control-core
        env:
          TESTING: "1"

      - name: P3 gate tests (no-bypass + unknown-outcome)
        run: python -m pytest tests/unit/test_no_bypass.py tests/unit/test_unknown_outcome.py -v --tb=short
        working-directory: services/control-core
        env:
          TESTING: "1"

      - name: Check alembic migration head
        run: alembic check
        working-directory: services/control-core
        env:
          TESTING: "1"

  # ---------------------------------------------------------------------------
  # macOS smoke — import + protocol only (no full suite yet, P5/P6)
  # ---------------------------------------------------------------------------
  macos-smoke:
    name: macOS smoke (import + protocol)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-core/pyproject.toml

      - name: Install control-core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: services/control-core

      - name: Protocol + platform tests (macOS smoke)
        run: |
          python -m pytest packages/protocol/tests/ packages/platform/tests/ ../../tests/ipc_smoke/ -v --tb=short
        working-directory: services/control-core

  # ---------------------------------------------------------------------------
  # Frontend lint (operator-console) — non-blocking for now
  # ---------------------------------------------------------------------------
  frontend-smoke:
    name: Operator Console smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-console-src/package-lock.json

      - name: Check package.json parseable
        run: |
          node -e "const p = require('./package.json'); console.log(p.name, p.version)"
        working-directory: apps/web-console-src

  # ---------------------------------------------------------------------------
  # License policy gate (P4 blocker #9) — fail on non-approved licenses
  # ---------------------------------------------------------------------------
  license-policy:
    name: License policy (rust+python+npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny || cargo install cargo-deny
      - name: Rust license check (deny.toml)
        run: |
          cd apps/desktop/src-tauri
          cargo deny --config ${{ github.workspace }}/tools/license-policy/deny.toml check licenses
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-license
        run: pip install pip-license
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Python + Node license check
        run: python tools/license-policy/check_licenses.py

  # ---------------------------------------------------------------------------
  # Reproducible Windows release build (P4 blocker #8) — cloud runner builds
  # the installer from the same commit + lockfiles and publishes digests for
  # comparison against the local build recorded in docs/releases/v1.0-gate.md
  # ---------------------------------------------------------------------------
  windows-release-build:
    name: Windows release build (reproducibility)
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build desktop (tauri NSIS)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run tauri build
      - name: Collect digests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "apps/desktop/src-tauri/target/release/tauri-spike.exe",
            (Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          )
          $out = @()
          foreach ($f in $files) {
            if (Test-Path $f) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash
              $size = (Get-Item $f).Length
              $out += "SHA256 $h  $size  $(Split-Path $f -Leaf)"
            }
          }
          $out | Tee-Object -FilePath release-digests.txt
          "commit=$env:GITHUB_SHA" | Add-Content release-digests.txt
      - name: Upload digests artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-digests-${{ github.sha }}
          path: release-digests.txt
          retention-days: 90
