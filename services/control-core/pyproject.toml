[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-agent-platform"
version = "3.11.0"
description = "Dual-edition controlled self-evolving Agent platform"
license = { text = "LicenseRef-Proprietary-Personal" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<25.0",
    "python-dotenv>=1.0,<2.0",
    "bcrypt>=4.0,<5.0",
    "strawberry-graphql>=0.230,<1.0",
    "typer>=0.12,<1.0",
    "prompt_toolkit>=3.0,<4.0",
    "rich>=13.0,<14.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-multipart>=0.0.6,<1.0",
]

[project.scripts]
myself = "apps.personal_shell.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.42",
]
docx = [
    "python-docx>=1.1",
]
redis = [
    "redis>=5,<7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.3",
    "pytest-playwright>=0.5.0",
    "bandit[toml]",
    "redis>=5,<7",
]
windows = [
    "pywin32>=306,<310",
    "Pillow>=12.3,<13.0",
    "uiautomation>=2.0.29,<3.0",
    "windows-capture==2.0.1",
]

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
# test_frontend_e2e.py drives the legacy Vue web frontend (apps/enterprise_admin_web)
# with playwright-async; merely collecting it poisons the process event loop and
# fails every later async test (pytest-playwright 0.8 x pytest-asyncio 1.4 on
# py3.12). The shipped desktop app (apps/desktop) is covered by the manual UI
# gate instead. Run it explicitly with `-o addopts= pytest tests/e2e/test_frontend_e2e.py`.
addopts = "--ignore=tests/e2e/test_frontend_e2e.py"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "e2e: End-to-end tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
