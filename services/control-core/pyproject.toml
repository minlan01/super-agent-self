[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlled-agent-platform"
version = "3.11.0"
description = "Dual-edition controlled self-evolving Agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.1,<25.0",
    "python-dotenv>=1.0,<2.0",
    "bcrypt>=4.0,<5.0",
    "strawberry-graphql>=0.230,<1.0",
    "typer>=0.12,<1.0",
    "prompt_toolkit>=3.0,<4.0",
    "rich>=13.0,<14.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-multipart>=0.0.6,<1.0",
]

[project.scripts]
myself = "apps.personal_shell.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.42",
]
docx = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.3",
    "pytest-playwright>=0.5.0",
    "bandit[toml]",
]
windows = [
    "pywin32>=306,<310",
    "Pillow>=10.0,<12.0",
]
windows-uia = [
    "uiautomation>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "e2e: End-to-end tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
