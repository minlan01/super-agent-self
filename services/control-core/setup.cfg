[importlinter]
root_packages =
    packages
    apps

# ============================================================================
# P0.4 架构边界约束（spec §4.5 + §2.3）
#
# import-linter 在此负责「叶子层」约束（platform、protocol 不得反向依赖）。
# 「routes 不得直接 import 工具类」的约束由 scripts/check_no_tool_bypass.py
# 单独检查（因为 _auto_import 的自动注册模式会让 forbidden 契约误报传递依赖）。
# ============================================================================

# 契约 1：platform 层禁止反向依赖业务层（零豁免）
[importlinter:contract:1]
name = Platform does not depend on business layer
type = forbidden
source_modules =
    packages.platform
forbidden_modules =
    packages.executor
    packages.agent_core
    packages.cron
    packages.skills
    packages.memory
    packages.llm_gateway
    packages.mcp
    packages.notification
    packages.messaging_gateway
    apps

# 契约 2：protocol 是叶子层（零豁免）
[importlinter:contract:2]
name = Protocol is a leaf layer
type = forbidden
source_modules =
    packages.protocol
forbidden_modules =
    packages.executor
    packages.agent_core
    packages.policy
    packages.db
    packages.cron
    packages.skills
    packages.memory
    packages.llm_gateway
    packages.mcp
    packages.notification
    packages.messaging_gateway
    packages.platform
    apps
