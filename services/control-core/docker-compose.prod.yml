# Production deployment — Controlled Agent Platform
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  init-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/target
    command: >
      sh -c "cp -r /app/static/* /target/ 2>/dev/null; echo 'Frontend initialized'"
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://agent:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/agent_platform
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://agent:${DB_PASSWORD:?DB_PASSWORD must be set}@db:5432/agent_platform
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
    expose:
      - "8000"
    volumes:
      - app_data:/app/data
      - app_workspace:/app/workspace
      - frontend_dist:/app/static:ro
    depends_on:
      init-frontend:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_platform
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pg_data:
  app_data:
  app_workspace:
  frontend_dist:
