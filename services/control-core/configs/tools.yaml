# Tool registry configuration.
#
# Code-backed tools (those with @tool_registry.register()) provide their
# description, emoji, and params_schema from the decorator.  This YAML only
# needs to specify **policy overrides**: risk_level, enabled, edition.
#
# Placeholder entries (no code class) keep their full definition so the
# policy engine can still recognise and block them.

tools:
  # ── Browser tools ────────────────────────────────────────────────────
  browser.open:
    category: browser
    risk_level: low

  browser.click:
    category: browser
    risk_level: low

  browser.extract_text:
    category: browser
    risk_level: low

  browser.screenshot:
    category: browser
    risk_level: low

  # ── File tools ───────────────────────────────────────────────────────
  file.write_docx:
    category: file
    risk_level: low

  file.write_markdown:
    category: file
    risk_level: low

  file.read:
    category: file
    risk_level: low

  file.delete:
    category: file
    risk_level: high

  file.list:
    category: file
    risk_level: low

  file.search:
    category: file
    risk_level: low
    edition: [personal]

  file.summarize:
    category: file
    risk_level: low
    edition: [personal]

  # ── System tools ─────────────────────────────────────────────────────
  shell.execute:
    category: system
    risk_level: high

  process.execute:
    category: system
    risk_level: high

  terminal.open:
    category: system
    risk_level: high

  terminal.write:
    category: system
    risk_level: high

  terminal.read:
    category: system
    risk_level: medium

  terminal.resize:
    category: system
    risk_level: medium

  terminal.signal:
    category: system
    risk_level: high

  terminal.attach:
    category: system
    risk_level: medium

  terminal.disconnect:
    category: system
    risk_level: medium

  terminal.heartbeat:
    category: system
    risk_level: low

  terminal.close:
    category: system
    risk_level: high

  # ── Web tools ────────────────────────────────────────────────────────
  web.search:
    category: web
    risk_level: low

  # ── Agent tools ──────────────────────────────────────────────────────
  delegate.task:
    category: agent
    risk_level: medium

  # ── Messaging tools ──────────────────────────────────────────────────
  message.send:
    category: messaging
    risk_level: medium
    edition: [personal]

  # ── Disabled placeholder tools (no code class) ───────────────────────
  shell.run:
    description: "Execute shell command (DISABLED)"
    category: system
    risk_level: critical
    enabled: false
    params_schema:
      type: object
      required: [command]
      properties:
        command:
          type: string
      additionalProperties: false

  desktop.click:
    category: desktop
    risk_level: high   # was medium; aligned with decorator (desktop_tools.py) and spec §6 (keyboard/mouse = High)

  desktop.type:
    category: desktop
    risk_level: medium

  desktop.screenshot:
    category: desktop
    risk_level: low

  desktop.files:
    category: desktop
    risk_level: medium

  desktop.windows:
    category: desktop
    risk_level: low

  system.modify:
    description: "Modify system settings (DISABLED)"
    category: system
    risk_level: critical
    enabled: false
    params_schema:
      type: object
      properties: {}
      additionalProperties: false

  # ── G-08a 修正：补登记此前脱管/漏登记的工具 ──────────────────────────
  # registry 已注册但 tools.yaml 缺失 → 运维无法经配置收敛 risk/enabled
  browser.bookmark:
    category: browser
    risk_level: low

  browser.monitor:
    category: browser
    risk_level: medium

  # 视觉三工具是 ToolBase 子类但从未注册进 registry（完全脱管）。
  # P0 阶段显式占位禁用：routes/vision.py 的直接 new + execute 旁路由 P0.5 修复。
  screen.capture:
    description: "Screen capture (DISABLED until registered via P0.5)"
    category: vision
    risk_level: medium
    enabled: false

  image.ocr:
    description: "Image OCR (DISABLED until registered via P0.5)"
    category: vision
    risk_level: low
    enabled: false

  image.analyze:
    description: "Image understanding (DISABLED until registered via P0.5)"
    category: vision
    risk_level: medium
    enabled: false
